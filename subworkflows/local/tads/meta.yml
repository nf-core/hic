# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "TADS"
description: |
  Workflow to identify Topologically Associating Domains (TADs) from Hi-C data.
  Supports two callers: Cooltools Insulation and HiCExplorer hicFindTADs.
  Takes a .cool file as input and outputs TAD calls along with tool version
  information.
keywords:
  - Hi-C
  - TADs
  - Cooltools
  - HiCExplorer
  - Genomics
components:
  - cooltools/insulation
  - hic/find/tads
input:
  - cool:
      type: file
      description: |
        Input Hi-C contact map in .cool format
      pattern: "*.cool"
output:
  - tads:
      type: file
      description: |
        TAD calls generated by the selected caller (TSV or results file)
      pattern: "*.tsv"
  - versions:
      type: file
      description: |
        Versions of tools used in the workflow
authors:
  - "@nservant"
maintainers:
  - "@nservant"
  - "@Thibault-Poinsignon"
